<header class="topo">
  <span class="marca titulo-sm">TrainingApp</span>
  @let g = gamificacao.dados();
  <a class="xp" routerLink="/perfil" [attr.aria-label]="'Nível ' + (g?.nivel ?? 1) + ', ' + formatar(g?.xpTotal ?? 0) + ' XP'">
    <span class="icone cheio" aria-hidden="true">bolt</span>
    <span class="num">{{ formatar(g?.xpTotal ?? 0) }} XP</span>
  </a>
</header>

<main class="conteudo">
  <router-outlet />
</main>

<nav class="abas" aria-label="Navegação principal">
  @for (aba of abas; track aba.caminho) {
    <a class="aba" [routerLink]="aba.caminho" routerLinkActive="ativa">
      <span class="icone" aria-hidden="true">{{ aba.icone }}</span>
      <span class="rotulo-aba">{{ aba.rotulo }}</span>
    </a>
  }
</nav>
