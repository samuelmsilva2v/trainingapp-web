name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      # O build de produção tem orçamento de tamanho (um estilo grande demais quebra o build da imagem).
      - run: npm run build
