<header class="topo">
  <button type="button" class="btn-icone" aria-label="Voltar" (click)="voltar()">
    <span class="icone" aria-hidden="true">arrow_back</span>
  </button>
  <h1 class="titulo-sm">Reportar bug ou sugestão</h1>
</header>

<div class="pagina">
  <p class="suave apoio">Conte o que aconteceu ou o que podia ser melhor. Respondemos pelo seu e-mail.</p>

  <form class="card" (submit)="$event.preventDefault(); enviar()">
    <label class="campo">
      <span class="rotulo suave">Nome</span>
      <span class="entrada">
        <span class="icone" aria-hidden="true">person</span>
        <input type="text" name="nome" autocomplete="name" [attr.maxlength]="nomeMax"
               [value]="nome()" (input)="nome.set($any($event.target).value)" />
      </span>
    </label>

    <div class="campo">
      <span class="rotulo suave" id="rotulo-categoria">Categoria</span>
      <!-- Dropdown próprio: o <select> nativo abre o diálogo padrão do Android, fora do visual do app. -->
      <div class="dropdown" (keydown.escape)="aberto.set(false)">
        <button type="button" class="gatilho" aria-haspopup="listbox" [attr.aria-expanded]="aberto()"
                aria-labelledby="rotulo-categoria valor-categoria" (click)="aberto.set(!aberto())">
          <span class="icone" aria-hidden="true">{{ icone() }}</span>
          <span class="valor" id="valor-categoria" [class.suave]="!categoria()">{{ rotuloCategoria() }}</span>
          <span class="icone" aria-hidden="true">{{ aberto() ? 'expand_less' : 'expand_more' }}</span>
        </button>
        @if (aberto()) {
          <div class="fundo" aria-hidden="true" (click)="aberto.set(false)"></div>
          <ul class="lista" role="listbox" aria-labelledby="rotulo-categoria">
            @for (c of categorias; track c.valor) {
              <li>
                <button type="button" class="opcao" role="option" [attr.aria-selected]="categoria() === c.valor"
                        [class.sel]="categoria() === c.valor" (click)="escolherCategoria(c.valor)">
                  <span class="icone" aria-hidden="true">{{ c.icone }}</span>
                  <span class="valor">{{ c.rotulo }}</span>
                  @if (categoria() === c.valor) {
                    <span class="icone" aria-hidden="true">check</span>
                  }
                </button>
              </li>
            }
          </ul>
        }
      </div>
    </div>

    <label class="campo">
      <span class="rotulo suave">Mensagem</span>
      <span class="area">
        <textarea name="mensagem" rows="6" [attr.maxlength]="mensagemMax"
                  placeholder="Descreva o que aconteceu, como chegar ao problema ou a sua ideia."
                  [value]="mensagem()" (input)="mensagem.set($any($event.target).value)"></textarea>
        <span class="contador num suave" aria-live="polite">{{ tamanho() }}/{{ mensagemMax }}</span>
      </span>
    </label>

    @if (erro()) {
      <p class="erro" role="alert">{{ erro() }}</p>
    }

    <button type="submit" class="btn btn-primario" [disabled]="!valido() || enviando()">
      {{ enviando() ? 'Enviando…' : 'Enviar' }}
      <span class="icone" aria-hidden="true">send</span>
    </button>
  </form>

  <p class="suave nota">Enviamos junto a versão do app e o aparelho para ajudar a investigar.</p>
</div>
