name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # Varre todo o histórico atrás de segredos; falso positivo vai para o .gitleaksignore (fingerprint do relatório).
  segredos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --verbose

  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      # O build de produção tem orçamento de tamanho (um estilo grande demais quebra o build da imagem).
      - run: npm run build
